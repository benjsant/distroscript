name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck + bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Vérification syntaxique : attrape les erreurs qui empêchent le script
      # de démarrer (quotes non fermées, if/fi dépareillés…).
      - name: bash -n
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::erreur de syntaxe"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit "$fail"

      # Analyse statique : variables non définies, quoting manquant, etc.
      # Les post_install.sh sourcent des fichiers copiés dans la box à l'exécution
      # (~/versions.sh, ~/shell_setup.sh), introuvables ici : -e SC1091/SC1090.
      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning --external-sources -e SC1091 -e SC1090

  packages:
    name: cohérence des packages.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Un packages.txt ne doit contenir que des noms de paquets et des
      # commentaires : une ligne avec un espace est presque toujours une faute
      # de frappe qui casserait le xargs d'installation.
      - name: Aucune ligne suspecte
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if grep -nE '^[^#]*[[:space:]]+[^[:space:]]' "$f"; then
              echo "::error file=$f::ligne contenant plusieurs mots"
              fail=1
            fi
          done < <(find . -name 'packages*.txt' -not -path './.git/*' -print0)
          exit "$fail"

      # Chaque environnement doit exposer le trio attendu par les scripts racine.
      - name: Structure des environnements
        run: |
          fail=0
          for dir in */; do
            [ -f "${dir}install.sh" ] || continue
            for required in post_install.sh packages.txt; do
              if [ ! -f "${dir}${required}" ]; then
                echo "::error::${dir} n'a pas de ${required}"
                fail=1
              fi
            done
            # Les environnements Ubuntu passent par lib/box_common.sh, qui
            # exige un verify.sh exécuté dans la box.
            case "$dir" in
              ubuntu_dev_*)
                [ -f "${dir}verify.sh" ] || { echo "::error::${dir} n'a pas de verify.sh"; fail=1; }
                ;;
            esac
          done
          exit "$fail"

      # Le bloc commun ne doit pas réapparaître dans un packages.txt : c'est la
      # régression que la déduplication doit empêcher.
      - name: Pas de duplication du bloc commun
        run: |
          fail=0
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            for f in ubuntu_dev_*/packages.txt; do
              if grep -qx "$pkg" "$f"; then
                echo "::error file=$f::'$pkg' est déjà dans lib/packages_common.txt"
                fail=1
              fi
            done
          done < <(grep -v '^[[:space:]]*#' lib/packages_common.txt | grep -v '^[[:space:]]*$')
          exit "$fail"

  cli:
    name: interface non interactive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Les scripts vérifient leurs prérequis avant tout : sans distrobox ni
      # moteur de conteneur, ils sortent en 1 et aucun test ne peut aller plus
      # loin. On les installe donc pour de vrai plutôt que d'affaiblir les
      # vérifications pour les besoins du test.
      - name: Installer podman et distrobox
        run: |
          command -v podman >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq podman
          curl -fsSL https://raw.githubusercontent.com/89luca89/distrobox/main/install \
            | sh -s -- --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Vérifier les prérequis
        run: |
          distrobox --version
          podman --version

      - name: --help et --list répondent
        run: |
          for f in install.sh update.sh uninstall.sh; do
            ./"$f" --help >/dev/null || { echo "::error::$f --help échoue"; exit 1; }
            ./"$f" --list >/dev/null || { echo "::error::$f --list échoue"; exit 1; }
          done

      - name: --list énumère bien tous les environnements
        run: |
          expected=$(find . -maxdepth 2 -name install.sh -not -path ./install.sh -printf '%h\n' \
                     | xargs -n1 basename | sort | wc -l)
          got=$(./install.sh --list | wc -l)
          [ "$expected" = "$got" ] || {
            echo "::error::--list liste $got environnements, $expected attendus"; exit 1; }

      - name: les arguments invalides sont rejetés
        run: |
          fail=0
          ./install.sh environnement-inexistant   >/dev/null 2>&1 && { echo "::error::nom invalide accepté"; fail=1; }
          ./install.sh --all ubuntu_dev_go        >/dev/null 2>&1 && { echo "::error::--all + nom accepté"; fail=1; }
          ./install.sh ubuntu_dev_go --profile xx >/dev/null 2>&1 && { echo "::error::profil invalide accepté"; fail=1; }
          ./install.sh --option-bidon             >/dev/null 2>&1 && { echo "::error::option inconnue acceptée"; fail=1; }
          ./uninstall.sh --all ubuntu_dev_go      >/dev/null 2>&1 && { echo "::error::uninstall --all + nom accepté"; fail=1; }
          exit "$fail"

      # --dry-run doit être inoffensif : aucune box, aucun dossier créé.
      - name: --dry-run n exécute rien
        run: |
          fail=0
          for box in $(./install.sh --list | cut -f1); do
            ./install.sh "$box" --yes --dry-run >/dev/null || {
              echo "::error::dry-run échoue pour $box"; fail=1; }
          done
          ./install.sh ubuntu_dev_python --profile data --yes --dry-run >/dev/null || fail=1
          ./uninstall.sh ubuntu_dev_go --yes --dry-run >/dev/null || fail=1
          [ -d "$HOME/distrobox" ] && [ -n "$(ls -A "$HOME/distrobox" 2>/dev/null)" ] && {
            echo "::error::le dry-run a créé des fichiers dans ~/distrobox"; fail=1; }
          exit "$fail"

  tests:
    name: tests unitaires (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      # Ces tests ne touchent ni à /etc, ni au réseau, ni à distrobox : les
      # commandes externes sont remplacées par des stubs dans le PATH de test.
      - name: bats
        run: bats tests/
